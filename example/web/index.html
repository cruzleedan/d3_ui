<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="d3_ui is a Flutter design system: tokens, themes and 50 components. This showcase lets you try every component, switch light and dark, and see a whole brand theme built from a design-token file.">
  <meta name="theme-color" content="#4D62C5">
  <meta property="og:type" content="website">
  <meta property="og:title" content="d3_ui: a Flutter design system">
  <meta property="og:description" content="Try every component, switch light and dark, and see a brand theme built from a token file.">
  <meta property="og:url" content="https://d3-ui.cruzleedan.work/">
  <meta property="og:image" content="https://d3-ui.cruzleedan.work/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="d3_ui: a Flutter design system, shown with a small Places app on a phone">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="d3_ui: a Flutter design system">
  <meta name="twitter:image" content="https://d3-ui.cruzleedan.work/og.png">
  <link rel="canonical" href="https://d3-ui.cruzleedan.work/">
  <meta name="color-scheme" content="light dark">
  <style>
    /* Shown while the app downloads; removed when Flutter draws its first frame. */
    body { margin: 0; background: #F3F5FB; }
    @media (prefers-color-scheme: dark) { body { background: #0F1117; color: #E6E8F0; } }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font: 16px Roboto, Helvetica, Arial, sans-serif; color: #5B6178; }
    #splash b { font-size: 44px; letter-spacing: -1px; color: #4D62C5; }
    #splash i { display: block; width: 160px; height: 3px; margin-top: 18px; border-radius: 2px;
      background: rgba(77,98,197,.18); overflow: hidden; }
    #splash i::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 2px;
      background: #4D62C5; animation: splash-bar 1.2s ease-in-out infinite; }
    @keyframes splash-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #splash i::after { animation: none; width: 100%; opacity: .5; } }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="d3_ui">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>d3_ui: a Flutter design system</title>
  <link rel="manifest" href="manifest.json">
  <!-- Start the two big downloads now, not after flutter_bootstrap.js has run. -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="canvaskit/chromium/canvaskit.wasm" as="fetch" type="application/wasm" crossorigin>
</head>
<body>
  <div id="splash"><b>d3_ui</b><span>A Flutter design system. Loading the showcase…</span><i></i></div>
  <noscript>
    d3_ui is a Flutter design system: tokens, themes and about fifty components.
    This showcase is a Flutter web app and needs JavaScript. The source is on GitHub: cruzleedan/d3_ui.
  </noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash'); if (s) s.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
